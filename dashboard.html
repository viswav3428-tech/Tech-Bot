<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Permissions-Policy" content="microphone=(self)">
<title>TEACHBOT Control</title>
<style>
  :root{--bg:#10141a;--panel:#171d26;--panel-border:#262e3a;--text:#e6eaf0;--text-dim:#8b93a3;--accent:#4fd1c5;--accent-dim:#2c7a72;--warn:#f0a742;--danger:#e5697b;--mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--panel-border)}
  header h1{font-size:18px;font-weight:600;margin:0}
  #conn{font-family:var(--mono);font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:8px}#conn .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim)}#conn.online .dot{background:var(--accent)}#conn.offline .dot{background:var(--danger)}
  main{display:grid;grid-template-columns:380px 1fr;gap:20px;padding:24px;max-width:1200px;margin:0 auto}@media(max-width:860px){main{grid-template-columns:1fr;padding:14px}.panel{margin-bottom:14px}}
  .panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:18px 20px;margin-bottom:20px}.panel h2{font-size:13px;font-weight:600;color:var(--text-dim);margin:0 0 14px}
  .stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--panel-border)}.stat-row:last-child{border-bottom:none}.stat-label{color:var(--text-dim);font-size:13px}.stat-value{font-family:var(--mono);font-size:15px}.stat-value.warn{color:var(--warn)}.stat-value.ok{color:var(--accent)}
  select,button,input[type=text]{font-family:var(--sans);font-size:14px;border-radius:7px;border:1px solid var(--panel-border);background:#0d1117;color:var(--text);padding:9px 12px}select{width:100%;margin-bottom:10px}button{cursor:pointer;border-color:var(--accent-dim);transition:.15s}button:hover{background:#16323030}button.primary{background:var(--accent);color:#06201c;font-weight:600;border:none}button.primary:hover{background:#6ddccf}button.danger{border-color:var(--danger);color:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn-row button{flex:1;min-width:90px}
  #taskBox{font-family:var(--mono);font-size:13px;color:var(--text-dim)}#taskBox.has-task{color:var(--text)}
  #chatLog{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;margin-bottom:14px}.msg{max-width:80%;padding:10px 13px;border-radius:9px;font-size:14px}.msg.user{align-self:flex-end;background:var(--accent-dim);color:#eafffb}.msg.agent{align-self:flex-start;background:#232b38}.msg .tag{display:block;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:5px}.chat-input-row{display:flex;gap:8px}.chat-input-row input{flex:1;min-width:0}
  #avatarBox{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#0d1117;border:1px solid var(--panel-border);border-radius:9px;margin-bottom:14px}#avatarFace{font-size:34px;line-height:1}#avatarLabel{font-family:var(--mono);font-size:13px;color:var(--text-dim);text-transform:capitalize}
  #voicePanel#micMini{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:8px;
}

#micMini button{
  width:34px;
  height:34px;
  padding:0;
  border-radius:50%;
  font-size:16px;
  background:#0d1117;
}

#micState{
  font-family:var(--mono);
  font-size:11px;
  color:var(--text-dim);
}

#micMini.ready button{
  border-color:var(--accent);
}

#micMini.error button{
  border-color:var(--danger);
}{background:#0d1117;border:1px solid var(--panel-border);border-radius:9px;padding:12px;margin-bottom:12px}.voice-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.voice-state{font-family:var(--mono);font-size:12px;color:var(--text-dim)}.voice-state.ok{color:var(--accent)}.voice-state.error{color:var(--danger)}.voice-state.warn{color:var(--warn)}#voiceHelp{font-size:12px;color:var(--text-dim);margin-top:8px}
  #voiceStatus{font-family:var(--mono);font-size:12px;color:var(--text-dim);min-height:16px;margin-bottom:6px}#voiceStatus.active{color:var(--accent)}#voiceStatus.error{color:var(--danger)}#muteBtn.muted{opacity:.5;border-color:var(--danger)}#micBtn.listening{background:var(--danger);color:white;border-color:var(--danger)}
  #slideName{color:var(--text-dim);font-size:13px;margin-top:8px}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#2a3340;border-radius:4px}
</style>
</head>
<body>
<header><h1>TEACHBOT Control</h1><div id="conn"><span class="dot"></span><span id="connText">connecting...</span></div></header>
<main>
  <div>
    <div class="panel"><h2>Robot status</h2><div class="stat-row"><span class="stat-label">Battery</span><span class="stat-value" id="stat-battery">--</span></div><div class="stat-row"><span class="stat-label">Mode</span><span class="stat-value" id="stat-mode">--</span></div><div class="stat-row"><span class="stat-label">Position</span><span class="stat-value" id="stat-pos">--</span></div><div class="stat-row"><span class="stat-label">Last update</span><span class="stat-value" id="stat-time">--</span></div></div>
    <div class="panel"><h2>Send command</h2><select id="destSelect"><option>Loading locations...</option></select><button class="primary" style="width:100%" onclick="sendTask('goto')">Go to destination</button><div class="btn-row"><button onclick="sendTask('follow')">Follow me</button><button onclick="sendTask('dock')">Return to dock</button></div><div class="btn-row"><button class="danger" style="width:100%" onclick="sendTask('stop')">Stop</button></div></div>
    <div class="panel"><h2>Current task</h2><div id="taskBox">No pending task</div></div>
    <div class="panel"><h2>Presentation slides <span style="color:var(--text-dim);font-weight:400">(placeholder)</span></h2><input type="file" id="slideFile" onchange="handleSlideUpload(this)"><div id="slideName">No file selected</div></div>
  </div>
  <div>
    <div class="panel"><h2>Talk to TEACHBOT</h2><div id="avatarBox"><span id="avatarFace">🤖</span><span id="avatarLabel">idle</span></div><div id="chatLog"></div>
      <div id="micMini">
  <button id="enableMicBtn" onclick="enableMicrophone()" title="Microphone settings">🎙️</button>
  <span id="micState">Mic</span>
</div>	
      <div id="voiceStatus"></div>
      <div class="chat-input-row"><input type="text" id="chatInput" placeholder="Ask a question or give a command..." onkeydown="if(event.key==='Enter')sendChat()"><button id="micBtn" onclick="toggleListening()" title="Speak instead of typing">🎤</button><button id="muteBtn" onclick="toggleMute()" title="Turn AI voice reply on/off">🔊</button><button class="primary" onclick="sendChat()">Send</button></div>
    </div>
  </div>
</main>
<script>
const BACKEND_URL="https://tech-bot-3hra.onrender.com";
const ROBOT_ID=1;
// For browsers without SpeechRecognition, set this to a backend speech-to-text endpoint.
// Example: https://tech-bot-3hra.onrender.com/transcribe
const TRANSCRIBE_URL=`${BACKEND_URL}/transcribe`;
let sessionId=null, muted=false, micStream=null, micReady=false, recognizer=null, listening=false, recognitionFailed=false;
const ANIMATION_FACES={idle:['🤖','idle'],speaking:['🗣️','speaking'],listening:['👂','listening'],navigating:['🧭','navigating'],following:['🚶','following'],delivering:['📦','delivering'],explaining_ohms_law:['⚡',"explaining ohm's law"],explaining_engineering:['📐','explaining']};
function updateAvatar(animation){const [face,label]=ANIMATION_FACES[animation]||['🤖','idle'];document.getElementById('avatarFace').textContent=face;document.getElementById('avatarLabel').textContent=label}
function toggleMute(){muted=!muted;const b=document.getElementById('muteBtn');b.textContent=muted?'🔇':'🔊';b.classList.toggle('muted',muted);if(muted&&window.speechSynthesis)speechSynthesis.cancel()}
let voicesReady=false;function primeVoices(){if(window.speechSynthesis&&speechSynthesis.getVoices().length)voicesReady=true}if(window.speechSynthesis){primeVoices();speechSynthesis.onvoiceschanged=primeVoices}
function speakReply(text){if(muted||!window.speechSynthesis)return;if(!voicesReady){primeVoices();if(!voicesReady){setVoiceStatus('Text-to-speech voice is unavailable in this browser/device.',true);return}}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';speechSynthesis.speak(u)}
function setConn(on){const e=document.getElementById('conn');e.className=on?'online':'offline';document.getElementById('connText').textContent=on?'connected':'unreachable'}
async function refreshStatus(){try{const r=await fetch(`${BACKEND_URL}/status/${ROBOT_ID}`);if(!r.ok)throw Error();const d=await r.json();const b=document.getElementById('stat-battery');b.textContent=d.battery_percent!=null?d.battery_percent+'%':'--';b.className='stat-value '+(d.battery_percent<20?'warn':'ok');document.getElementById('stat-mode').textContent=d.mode||'--';document.getElementById('stat-pos').textContent=d.pos_x!=null&&d.pos_y!=null?`${Number(d.pos_x).toFixed(2)}, ${Number(d.pos_y).toFixed(2)}`:'--';document.getElementById('stat-time').textContent=d.reported_at?new Date(d.reported_at).toLocaleTimeString():'--';setConn(true)}catch(e){setConn(false)}}
async function refreshTask(){try{const r=await fetch(`${BACKEND_URL}/tasks/pending/${ROBOT_ID}`);const tasks=await r.json();const box=document.getElementById('taskBox');if(tasks&&tasks.length){const t=tasks[0];box.className='has-task';box.textContent=`${String(t.task_type).toUpperCase()} · destination_id=${t.destination_id??'—'} · requested via ${t.requested_via}`}else{box.className='';box.textContent='No pending task'}}catch(e){}}
async function loadLocations(){try{const r=await fetch(`${BACKEND_URL}/locations`);if(!r.ok)throw Error();const locs=await r.json();const s=document.getElementById('destSelect');s.innerHTML='';locs.forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.name;s.appendChild(o)})}catch(e){document.getElementById('destSelect').innerHTML='<option>Could not load locations</option>'}}
async function sendTask(type){const destId=document.getElementById('destSelect').value;const body={robot_id:ROBOT_ID,task_type:type,requested_via:'dashboard'};if(type==='goto'&&destId)body.destination_id=parseInt(destId,10);try{const r=await fetch(`${BACKEND_URL}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error();refreshTask()}catch(e){alert('Could not send command — check backend connection')}}
function appendMessage(text,sender,animation){const log=document.getElementById('chatLog');const div=document.createElement('div');div.className=`msg ${sender}`;div.textContent=text;if(animation){const tag=document.createElement('span');tag.className='tag';tag.textContent=`animation: ${animation}`;div.appendChild(tag)}log.appendChild(div);log.scrollTop=log.scrollHeight}
async function sendChat(){const input=document.getElementById('chatInput'),message=input.value.trim();if(!message)return;appendMessage(message,'user');input.value='';try{const payload={message,robot_id:ROBOT_ID};if(sessionId)payload.session_id=sessionId;const r=await fetch(`${BACKEND_URL}/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error();const d=await r.json();sessionId=d.session_id||sessionId;appendMessage(d.reply_text||'No reply received.','agent',d.animation);updateAvatar(d.animation);speakReply(d.reply_text||'');refreshTask()}catch(e){appendMessage('Could not reach TEACHBOT — check backend connection.','agent')}}
function setVoiceStatus(text,error=false){const e=document.getElementById('voiceStatus');e.textContent=text;e.className=error?'error':'active'}
function setMicState(text,kind=''){const e=document.getElementById('micState');e.textContent=text;e.className='voice-state '+kind}
function isSecureForMic(){return window.isSecureContext||location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.protocol==='file:'}
async function checkMicPermission(){try{if(!navigator.permissions?.query)return null;const p=await navigator.permissions.query({name:'microphone'});setMicState('Microphone: '+p.state,p.state==='granted'?'ok':p.state==='denied'?'error':'warn');p.onchange=()=>setMicState('Microphone: '+p.state,p.state==='granted'?'ok':p.state==='denied'?'error':'warn');return p.state}catch(e){return null}}
async function enableMicrophone(){
  if(!navigator.mediaDevices?.getUserMedia){setMicState('Microphone: unavailable','error');setVoiceStatus('This page cannot access the microphone. Open the dashboard over HTTPS (not an insecure HTTP page).',true);return false}
  if(!isSecureForMic()){setMicState('Microphone: insecure page','error');setVoiceStatus('Microphone access requires HTTPS, localhost, or a trusted local context.',true);return false}
  try{
    setVoiceStatus('Requesting microphone permission…',false);
    // One explicit permission request, initiated by the button. We immediately stop the track;
    // this prevents the microphone from staying active while the dashboard is idle.
    const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    stream.getTracks().forEach(t=>t.stop());
    micReady=true;
setMicState('Ready','ok');
document.getElementById('micMini').classList.add('ready');
document.getElementById('enableMicBtn').title='Microphone ready';
setVoiceStatus('Microphone enabled. Tap 🎤 to speak.',false);
    await checkMicPermission();
    initRecognition();
    return true;
  }catch(e){
    console.error(e);
    const msg={NotAllowedError:'Permission denied. In your browser site settings, allow Microphone for this dashboard, then reload.',NotFoundError:'No microphone was found on this device.',NotReadableError:'The microphone is busy or blocked by another application.',SecurityError:'Microphone access is disabled by the browser or page policy.'}[e.name]||`Microphone error: ${e.name||e.message}`;
    setMicState('Microphone: '+(e.name||'error'),'error');setVoiceStatus(msg,true);return false;
  }
}
const SpeechRecognitionAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
function initRecognition(){
  if(!SpeechRecognitionAPI){setVoiceStatus('Browser speech recognition is not available. The dashboard needs a /transcribe backend endpoint for Firefox and other browsers.',true);return}
  if(recognizer)return;
  recognizer=new SpeechRecognitionAPI();recognizer.lang='en-IN';recognizer.interimResults=false;recognizer.continuous=false;recognizer.maxAlternatives=1;
  try{if('processLocally' in recognizer)recognizer.processLocally=false}catch(e){}
  recognizer.onstart=()=>{setListening(true);setVoiceStatus('Listening… speak now',false);updateAvatar('listening')};
  recognizer.onspeechstart=()=>setVoiceStatus('Hearing you…',false);
  recognizer.onresult=e=>{const heard=e.results?.[0]?.[0]?.transcript?.trim();if(!heard){setVoiceStatus('No words detected.',true);return}setVoiceStatus(`Heard: "${heard}"`,false);document.getElementById('chatInput').value=heard;sendChat()};
  recognizer.onerror=e=>{console.error('SpeechRecognition:',e.error,e.message);setListening(false);updateAvatar('idle');const m={ 'no-speech':'No speech detected. Tap the mic and speak immediately.','audio-capture':'Microphone could not be captured. Check the selected microphone.','not-allowed':'Microphone permission is blocked. Allow Microphone for this site and reload.','network':'This browser cannot reach its speech-recognition service. Brave/other Chromium builds can show this even when microphone permission is granted. Use Chrome or configure the /transcribe backend fallback.','service-not-allowed':'The browser speech service is unavailable. Use the /transcribe backend fallback.','aborted':'Listening was stopped.'};setVoiceStatus(m[e.error]||`Speech recognition error: ${e.error}`,true)};
  recognizer.onend=()=>{setListening(false);if(document.getElementById('avatarLabel').textContent==='listening')updateAvatar('idle')};
}
function setListening(on){listening=on;const b=document.getElementById('micBtn');b.classList.toggle('listening',on);b.textContent=on?'⏹':'🎤'}
async function toggleListening(){if(listening){try{recognizer?.stop()}catch(e){}setListening(false);return}if(!micReady){const ok=await enableMicrophone();if(!ok)return}initRecognition();if(!recognizer){setVoiceStatus('This browser has no built-in speech recognition. A /transcribe endpoint is required for voice input here.',true);return}try{setVoiceStatus('Starting microphone…',false);recognizer.start()}catch(e){console.error(e);setVoiceStatus('Could not start voice input. Tap once more after the browser finishes permission setup.',true);setListening(false)}}
function handleSlideUpload(input){const l=document.getElementById('slideName');l.textContent=input.files?.length?`Selected: ${input.files[0].name} (display only — not uploaded yet)`:'No file selected'}
(async()=>{loadLocations();refreshStatus();refreshTask();checkMicPermission();setInterval(refreshStatus,5000);setInterval(refreshTask,5000)})();
</script>
</body>
</html>
